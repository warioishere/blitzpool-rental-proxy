[package]
name = "stratum-rental-proxy"
version = "0.6.0"
edition = "2021"
authors = ["Blitzpool Contributors <https://yourdevice.ch>"]
description = "Stratum hashrate-rental proxy: sellers' miners run on their own default pool until rented, then are server-side rerouted to the buyer's target — no miner reconfiguration. Speaks Stratum V1 and V2, with a bidirectional SV1<->SV2 translator so a miner of either protocol can mine against a pool of either protocol."
license = "AGPL-3.0-or-later"
repository = "https://github.com/warioishere/blitzpool-rental-proxy"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
axum = "0.8"
# Persistent state (rigs + orders) in embedded SQLite — ACID, WAL, one file.
# Typed compile-time-checked queries; the `.sqlx/` offline cache (committed)
# lets the build run without a live DB (SQLX_OFFLINE).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }

# Stratum V2 protocol + Noise transport.
#   - stratum-core re-exports the protocol set (codec_sv2 + noise_sv2 +
#     parsers_sv2 + mining_sv2 + common_messages_sv2 + binary_sv2 +
#     channels_sv2). The `translation` feature adds the stratum_translation +
#     sv1_api sub-crates: SV1<->SV2 message conversion + the SV1 protocol types,
#     used by the bidirectional translator that lets a buyer pool speak either
#     protocol regardless of the rig.
#   - stratum-apps::network_helpers gives the Noise TCP transport
#     (connect_with_noise / accept_noise_connection -> NoiseTcpStream).
# UPSTREAM-PIN: stratum-mining/sv2-apps tag v0.9.2, and stratum-core exactly
# the crates.io version that tag pins (0.7.0), so Cargo builds one
# stratum-core graph.
stratum-core = { version = "=0.7.0", features = ["translation"] }
stratum-apps = { git = "https://github.com/stratum-mining/sv2-apps", tag = "v0.9.2", default-features = false, features = ["network", "std"] }
# secp256k1 matched to noise_sv2's version so the keypair types line up; rand
# for key generation.
secp256k1 = { version = "0.28", features = ["rand", "alloc"] }
rand = "0.8"
# 256-bit integer division for the bdiff difficulty<->target conversion in the
# translator (translate.rs). Already present transitively via the SV2 stack.
primitive-types = { version = "0.13", default-features = false }
# TLS to the Electrum server that supplies the Bitcoin tip for the pool probe
# (src/chain.rs). ring as the crypto provider: no cmake/NASM in the build.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
